<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ELD Checker — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc; color: #0f172a;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 4px 6px rgba(15,23,42,.04), 0 10px 15px rgba(15,23,42,.06);
      padding: 32px; width: 100%; max-width: 360px;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, #0f172a, #334155);
      color: #fff; display: grid; place-items: center; font-weight: 700;
    }
    h1 { font-size: 1rem; font-weight: 600; line-height: 1.2; }
    .brand span { font-size: .78rem; color: #64748b; }
    label {
      display: block; font-size: .78rem; font-weight: 600;
      color: #64748b; text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 10px 12px; font-size: .92rem; font-family: inherit;
      border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc;
    }
    input:focus { outline: 2px solid #2563eb; outline-offset: -1px; background: #fff; }
    button {
      width: 100%; margin-top: 16px; padding: 11px;
      background: #0f172a; color: #fff; border: none; border-radius: 6px;
      font-size: .88rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    button:hover { background: #1e293b; }
    .error {
      margin-top: 14px; padding: 10px 12px; font-size: .82rem;
      background: #fef2f2; color: #dc2626;
      border: 1px solid #fecaca; border-radius: 6px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" autocomplete="off">
    <div class="brand">
      <div class="logo">EL</div>
      <div>
        <h1>ELD Checker</h1>
        <span>Sign in to continue</span>
      </div>
    </div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus
           autocapitalize="off" spellcheck="false" />
    <label for="password" style="margin-top:14px">Password</label>
    <input type="password" id="password" name="password" required />
    <button type="submit">Sign in</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
